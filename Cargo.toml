[package]
name = "mcfilin"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A file viewer with Miller columns, after NeXTSTEP's File Viewer"
authors = ["Robert Lillack <rob@lillack.net>"]
license = "MIT"
repository = "https://github.com/roblillack/mcfilin"
homepage = "https://github.com/roblillack/mcfilin"
readme = "README.md"
keywords = ["file-manager", "file-browser", "miller-columns", "nextstep", "retro"]
categories = ["gui", "filesystem"]
# The README's screenshot and the CI config stay out of the package.
exclude = ["docs/", ".github/"]

# cargo-release: `cargo release minor --execute` rolls the changelog's
# [Unreleased] section over to the new version, re-seeds an empty one above
# it, and pushes the tag that the Release workflow builds the binaries and
# the GitHub release from. The substitutions run in order: version, compare
# link and date first, then the markers put "Unreleased" and "ReleaseDate"
# back for the next release.
[package.metadata.release]
allow-branch = ["main"]
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "Unreleased", replace = "{{version}}" },
    { file = "CHANGELOG.md", search = '\.\.\.HEAD', replace = "...{{tag_name}}", exactly = 1 },
    { file = "CHANGELOG.md", search = "ReleaseDate", replace = "{{date}}" },
    { file = "CHANGELOG.md", search = "<!-- next-header -->", replace = "<!-- next-header -->\n\n## [Unreleased] - ReleaseDate", exactly = 1 },
    { file = "CHANGELOG.md", search = "<!-- next-url -->", replace = "<!-- next-url -->\n[Unreleased]: https://github.com/roblillack/mcfilin/compare/{{tag_name}}...HEAD", exactly = 1 },
]

[dependencies]
saudade = "0.9"
# Thumbnails: the cache names them by the MD5 of the file's URI, and they are PNGs.
md-5 = "0.10"
png = "0.17"

# Cut, Copy and Paste of files through the system clipboard, configured as
# saudade has it.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
arboard = { version = "3", default-features = false }

[target.'cfg(unix)'.dependencies]
# Local time, and user / group names, for the info column.
libc = "0.2"
