[package]
name = "mcfilin"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A file viewer with Miller columns, after NeXTSTEP's File Viewer"
license = "MIT"

[dependencies]
saudade = "0.8"
# Thumbnails: the cache names them by the MD5 of the file's URI, and they are PNGs.
md-5 = "0.10"
png = "0.17"

# Cut, Copy and Paste of files through the system clipboard, configured as
# saudade has it.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
arboard = { version = "3", default-features = false }

[target.'cfg(unix)'.dependencies]
# Local time, and user / group names, for the info column.
libc = "0.2"

# EventCtx::modifiers and the re-hover on modifier changes, until they are
# released.
[patch.crates-io]
saudade = { path = "../saudade" }
