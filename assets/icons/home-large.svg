<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 32px house for the home folder on the shelf, drawn like the folder:
       each part a black silhouette under a face one unit inside it, lit from
       the top left. -->
  <defs>
    <clipPath id="roof"><path d="M16 2.41 L29.59 16 H2.41 Z"/></clipPath>
    <clipPath id="wall"><rect x="4" y="19" width="24" height="11"/></clipPath>
  </defs>

  <!-- Chimney: a stone cap over a brick stack, standing behind the roof. -->
  <rect x="21" y="4" width="5" height="10" fill="#000000"/>
  <rect x="22" y="5" width="3" height="9" fill="#b04838"/>
  <rect x="22" y="7" width="3" height="1" fill="#6c2418"/>
  <rect x="22" y="10" width="3" height="1" fill="#6c2418"/>
  <rect x="23" y="5" width="1" height="2" fill="#6c2418"/>
  <rect x="24" y="8" width="1" height="2" fill="#6c2418"/>
  <rect x="22" y="5" width="1" height="2" fill="#d87060"/>
  <rect x="20" y="2" width="7" height="3" fill="#000000"/>
  <rect x="21" y="3" width="5" height="1" fill="#f0f0f0"/>

  <!-- Roof: a black silhouette, the red face one unit inside it, with rows of
       shingles, a lit left edge, and a white fascia board along the eaves. -->
  <path d="M16 1 L31 16 H1 Z" fill="#000000"/>
  <rect x="1" y="16" width="30" height="3" fill="#000000"/>
  <path d="M16 2.41 L29.59 16 H2.41 Z" fill="#c8382c"/>
  <g clip-path="url(#roof)" fill="#8c2018">
    <rect x="0" y="6" width="32" height="1"/>
    <rect x="0" y="9" width="32" height="1"/>
    <rect x="0" y="12" width="32" height="1"/>
    <rect x="0" y="15" width="32" height="1"/>
    <rect x="15" y="7" width="1" height="2"/>
    <rect x="17" y="7" width="1" height="2"/>
    <rect x="11" y="10" width="1" height="2"/>
    <rect x="14" y="10" width="1" height="2"/>
    <rect x="18" y="10" width="1" height="2"/>
    <rect x="21" y="10" width="1" height="2"/>
    <rect x="8" y="13" width="1" height="2"/>
    <rect x="12" y="13" width="1" height="2"/>
    <rect x="16" y="13" width="1" height="2"/>
    <rect x="20" y="13" width="1" height="2"/>
    <rect x="24" y="13" width="1" height="2"/>
  </g>
  <path d="M16 2.41 L2.41 16 H3.83 L16 3.83 Z" fill="#f08070"/>
  <rect x="2" y="17" width="28" height="1" fill="#ffffff"/>

  <!-- Walls: clapboard siding, shaded under the eaves and down the right. -->
  <rect x="3" y="18" width="26" height="13" fill="#000000"/>
  <rect x="4" y="19" width="24" height="11" fill="#f0e6c8"/>
  <g clip-path="url(#wall)">
    <rect x="4" y="19" width="24" height="1" fill="#b8a478"/>
    <rect x="4" y="22" width="24" height="1" fill="#d4c49c"/>
    <rect x="4" y="25" width="24" height="1" fill="#d4c49c"/>
    <rect x="4" y="28" width="24" height="1" fill="#d4c49c"/>
    <rect x="4" y="20" width="1" height="10" fill="#fffaf0"/>
    <rect x="27" y="20" width="1" height="10" fill="#c8b48c"/>
  </g>

  <!-- Windows: four panes of sky behind white glazing bars, each catching a
       glint in its top-left corner. -->
  <rect x="5" y="21" width="7" height="7" fill="#000000"/>
  <rect x="6" y="22" width="5" height="5" fill="#3c70c0"/>
  <rect x="6" y="22" width="2" height="2" fill="#78b0f0"/>
  <rect x="6" y="22" width="1" height="1" fill="#e0f0ff"/>
  <rect x="8" y="22" width="1" height="5" fill="#ffffff"/>
  <rect x="6" y="24" width="5" height="1" fill="#ffffff"/>
  <rect x="20" y="21" width="7" height="7" fill="#000000"/>
  <rect x="21" y="22" width="5" height="5" fill="#3c70c0"/>
  <rect x="21" y="22" width="2" height="2" fill="#78b0f0"/>
  <rect x="21" y="22" width="1" height="1" fill="#e0f0ff"/>
  <rect x="23" y="22" width="1" height="5" fill="#ffffff"/>
  <rect x="21" y="24" width="5" height="1" fill="#ffffff"/>

  <!-- Door: panelled wood, lit down its left edge, with a brass knob. -->
  <rect x="13" y="20" width="6" height="11" fill="#000000"/>
  <rect x="14" y="21" width="4" height="9" fill="#8a5a2b"/>
  <rect x="14" y="21" width="1" height="9" fill="#b07a40"/>
  <rect x="15" y="22" width="2" height="3" fill="#6a4018"/>
  <rect x="15" y="26" width="2" height="3" fill="#6a4018"/>
  <rect x="17" y="25" width="1" height="1" fill="#ffd800"/>
</svg>
