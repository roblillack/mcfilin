<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 32px application icon: an open file drawer seen from the front, with a
       manila folder, a sheet of paper and a second folder standing in it.
       Drawn like the folder and the house: each part a black silhouette under
       a face one unit inside it, lit from the top left. -->

  <!-- Back folder, its tab on the left. -->
  <path d="M4 17 V1 H13 L15 3 H28 V17 Z" fill="#000000"/>
  <path d="M5 17 V2 H12.6 L14.6 4 H27 V17 Z" fill="#c5c53a"/>
  <path d="M5 2 H12.6 L14.6 4 H27 V5 H14.2 L12.2 3 H6 V17 H5 Z" fill="#e8e878"/>
  <rect x="26" y="5" width="1" height="12" fill="#a0a020"/>

  <!-- A sheet of paper between the folders. -->
  <rect x="6" y="5" width="20" height="12" fill="#000000"/>
  <rect x="7" y="6" width="18" height="11" fill="#ffffff"/>
  <rect x="9" y="7" width="12" height="1" fill="#909090"/>
  <rect x="9" y="9" width="7" height="1" fill="#909090"/>

  <!-- Front folder, its tab on the right. -->
  <path d="M3 18 V10 H17 L19 8 H29 V18 Z" fill="#000000"/>
  <path d="M4 18 V11 H17.4 L19.4 9 H28 V18 Z" fill="#ffff80"/>
  <path d="M4 11 H17.4 L19.4 9 H28 V10 H19.8 L17.8 12 H5 V18 H4 Z" fill="#ffffd8"/>
  <rect x="27" y="10" width="1" height="8" fill="#d0d048"/>

  <!-- Drawer front. -->
  <rect x="1" y="16" width="30" height="15" fill="#000000"/>
  <rect x="2" y="17" width="28" height="13" fill="#3c70c0"/>
  <rect x="2" y="17" width="28" height="1" fill="#78b0f0"/>
  <rect x="2" y="18" width="1" height="12" fill="#78b0f0"/>
  <rect x="3" y="29" width="27" height="1" fill="#244880"/>
  <rect x="29" y="18" width="1" height="11" fill="#244880"/>

  <!-- Label holder with its card. -->
  <rect x="10" y="19" width="12" height="5" fill="#000000"/>
  <rect x="11" y="20" width="10" height="3" fill="#ffffff"/>
  <rect x="13" y="21" width="6" height="1" fill="#909090"/>

  <!-- Brass pull. -->
  <rect x="11" y="25" width="10" height="4" fill="#000000"/>
  <rect x="12" y="26" width="8" height="1" fill="#ffd800"/>
  <rect x="12" y="27" width="8" height="1" fill="#b89400"/>
  <rect x="12" y="26" width="1" height="1" fill="#fff0a0"/>
</svg>
