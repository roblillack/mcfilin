<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 32 32"
   version="1.1"
   id="svg21"
   sodipodi:docname="mcfilin.svg"
   inkscape:version="1.4.3 (0d15f75042, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs21" />
  <sodipodi:namedview
     id="namedview21"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     showgrid="false"
     inkscape:zoom="18.21875"
     inkscape:cx="14.353345"
     inkscape:cy="16.38422"
     inkscape:window-width="1526"
     inkscape:window-height="792"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg21" />
  <!-- Program icon: a yellow filing cabinet in the manner of Windows 3.1's
       File Manager, its middle drawer pulled out to show a folder inside.
       It is drawn in oblique projection: the front square on, the depth
       running up and to the right at 45 degrees. Every face is filled and
       outlined in black at pixel centres, so the straight edges land crisply
       on the grid. The colours are the large folder's: the cabinet in its
       olive, and each drawer front like its front flap, pale yellow with a
       light edge along the top and left and a darker one along the bottom
       and right. -->
  <!-- The cabinet: right side in shadow, lit top, and front. -->
  <path
     d="M22.5 8.5 L28.5 2.5 L28.5 24.5 L22.5 30.5 Z"
     fill="#a0a020"
     stroke="#000000"
     stroke-width="1"
     stroke-linejoin="round" />
  <path
     d="M5.5 8.5 L11.5 2.5 L28.5 2.5 L22.5 8.5 Z"
     fill="#e8e878"
     stroke="#000000"
     stroke-width="1"
     stroke-linejoin="round" />
  <path
     d="M5.5 8.5 L22.5 8.5 L22.5 30.5 L5.5 30.5 Z"
     fill="#c5c53a"
     stroke="#000000"
     stroke-width="1"
     stroke-linejoin="round" />
  <!-- The closed drawers above and below fill the front from side to side,
       without outlines of their own, each bevelled like the folder's front
       flap and with a handle. -->
  <rect x="6" y="9" width="16" height="6" fill="#ffff80" />
  <rect x="6" y="9" width="16" height="1" fill="#ffffd8" />
  <rect x="6" y="10" width="1" height="5" fill="#ffffd8" />
  <rect x="7" y="14" width="15" height="1" fill="#d0d048" />
  <rect x="21" y="10" width="1" height="4" fill="#d0d048" />
  <rect x="11" y="12" width="5" height="1" fill="#000000" />
  <rect x="6" y="24" width="16" height="6" fill="#ffff80" />
  <rect x="6" y="24" width="16" height="1" fill="#ffffd8" />
  <rect x="6" y="25" width="1" height="5" fill="#ffffd8" />
  <rect x="7" y="29" width="15" height="1" fill="#d0d048" />
  <rect x="21" y="25" width="1" height="4" fill="#d0d048" />
  <rect x="11" y="27" width="5" height="1" fill="#000000" />
  <!-- The open drawer: the dark hollow it leaves in the cabinet, its outline
       lying on the cabinet's sides and setting it apart from the drawers
       above and below; then its side and its inside, both grey, seen over
       its rim. -->
  <path
     d="M5.5 15.5 L22.5 15.5 L22.5 23.5 L5.5 23.5 Z"
     fill="#302800"
     stroke="#000000"
     stroke-width="1"
     stroke-linejoin="round" />
  <path
     d="M18.5 19.5 L22.5 15.5 L22.5 23.5 L18.5 27.5 Z"
     fill="#808080"
     stroke="#000000"
     stroke-width="1"
     stroke-linejoin="round" />
  <path
     d="M1.5 19.5 L5.5 15.5 L22.5 15.5 L18.5 19.5 Z"
     fill="#999999"
     stroke="#000000"
     stroke-width="1"
     stroke-linejoin="round" />
  <!-- A folder standing in it, its tab up over the drawer above, outlined
       only along the top that shows above the rim. -->
  <path
     d="M3.5 17.5 L7.5 17.5 L7.5 15.5 L12.5 15.5 L12.5 17.5 L18.5 17.5 L18.5 26.5 L3.5 26.5 Z"
     fill="#ffffff" />
  <path
     d="M3.5 17.5 L7.5 17.5 L7.5 15.5 L12.5 15.5 L12.5 17.5 L18.5 17.5"
     fill="none"
     stroke="#000000"
     stroke-width="1" />
  <!-- The open drawer's front, pulled out towards the viewer: the size of
       its slot, and bevelled like the others. -->
  <path
     d="M1.5 19.5 L18.5 19.5 L18.5 27.5 L1.5 27.5 Z"
     fill="#ffff80"
     stroke="#000000"
     stroke-width="1"
     stroke-linejoin="round" />
  <rect x="2" y="20" width="16" height="7" fill="#ffff80" />
  <rect x="2" y="20" width="16" height="1" fill="#ffffd8" />
  <rect x="2" y="21" width="1" height="6" fill="#ffffd8" />
  <rect x="3" y="26" width="15" height="1" fill="#d0d048" />
  <rect x="17" y="21" width="1" height="5" fill="#d0d048" />
  <rect x="7" y="24" width="5" height="1" fill="#000000" />
</svg>
